<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Integration</title>
    ;<link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="loginContainer">
        <h2>Login</h2>
            <form id="loginForm">
                <label for="loginUserEmail">Email:</label>
                <input type="email" id="loginUserEmail" name="UserEmail" placeholder="Email" required>
                <label for="loginUserPassword">Password:</label>
                <input type="password" id="loginUserPassword" name="UserPassword" placeholder="Password" required>
                <p>Did not have an account? <a href="/index.html">Register</a></p>
                <button type="submit">Login</button>
            </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
